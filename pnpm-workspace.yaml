# https://pnpm.io/pnpm-workspace_yaml
packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # Required by Vite, Vitest, Expo, and React Native tooling.
  esbuild: true

overrides:
  # react-native-css 3.x currently relies on the Lightning CSS visitor shape from 1.30.1.
  lightningcss: 1.30.1

# Avoid auto-installing before clean scripts that remove node_modules.
verifyDepsBeforeRun: false
