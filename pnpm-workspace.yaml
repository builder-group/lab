# https://pnpm.io/pnpm-workspace_yaml
packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  # Required by Vite, Vitest, Expo, and React Native tooling
  esbuild: true

overrides:
  # NativeWind's CSS compiler fails with Lightning CSS 1.33
  '@expo/metro-config>lightningcss': 1.30.1

# Avoid auto-installing before clean scripts that remove node_modules
verifyDepsBeforeRun: false
