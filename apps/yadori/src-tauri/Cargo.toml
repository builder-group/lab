[package]
name = "yadori"
version = "0.1.0"
description = "Local planning for portable homes"
authors = ["@bennobuilder"]
license = "AGPL-3.0-or-later"
edition = "2021"

[workspace]

[lib]
name = "yadori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
keyring = "4.2.0"
getrandom = "0.3.4"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros", "process"] }

zip = { version = "2", default-features = false, features = ["deflate"] }
fs2 = "0.4"
base64 = "0.22"
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
